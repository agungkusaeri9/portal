name: CI/CD Pipeline - Main Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------
  # 1. Job Validasi & Test Build (Bun Runtime)
  # ----------------------------------------------------
  validate:
    name: Code Check & Build (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🔍 Svelte Check & Type Verification
        run: bun run check

      - name: 🏗️ Test Production Build
        run: bun run build

  # ----------------------------------------------------
  # 2. Job Docker Build & Container Registry Push
  # ----------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Image (Bun)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------
  # 3. Job Deploy Otomatis ke Server VPS via SSH
  # ----------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🌐 SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 45s
          command_timeout: 4m
          script: |
            cd ${{ secrets.VPS_PATH || '~/portal' }}
            echo "Working directory: $(pwd)"
            echo "Pulling latest Docker image from GHCR..."
            docker compose pull
            echo "Restarting containers..."
            docker compose up -d --remove-orphans --force-recreate
            echo "Cleaning unused dangling images..."
            docker image prune -f
            echo "Deployment completed successfully! 🚀"
