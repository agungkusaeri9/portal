name: CI/CD Pipeline - Main Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------
  # 1. Job Validasi & Test Build (Bun Runtime)
  # ----------------------------------------------------
  validate:
    name: Code Check & Build (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🔍 Svelte Check & Type Verification
        run: bun run check

      - name: 🏗️ Test Production Build
        run: bun run build

  # ----------------------------------------------------
  # 2. Job Deploy Otomatis ke Server VPS via SSH (Git Pull)
  # ----------------------------------------------------
  deploy:
    name: Deploy to VPS (Git Pull & Build)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🌐 SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 45s
          command_timeout: 8m
          script: |
            cd ${{ secrets.VPS_PATH || '~/portal' }}
            echo "Working directory: $(pwd)"
            echo "Pulling latest code from GitHub..."
            git pull origin main
            echo "Building Docker container locally..."
            docker compose build --no-cache
            echo "Restarting containers..."
            docker compose up -d --remove-orphans --force-recreate
            echo "Cleaning unused dangling images..."
            docker image prune -f
            echo "Deployment completed successfully! 🚀"
